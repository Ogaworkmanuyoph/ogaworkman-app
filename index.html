<script>
// OGAWORKMAN ULTRA PERSISTENCE V3 - FINAL
(function(){
  console.log('🛡️ OgaWorkman V3 persistence active');
  const MAIN_KEY = 'ogawork_artisans';
  const BACKUP_KEYS = ['ogawork_artisans_backup','ogawork_artisans_v2','ogawork_backup_final'];
  
  function getAllLocal(){
    let all = [];
    try{
      let main = JSON.parse(localStorage.getItem(MAIN_KEY)||'[]');
      all = all.concat(main);
      BACKUP_KEYS.forEach(k=>{
        try{
          let b = JSON.parse(localStorage.getItem(k)||'[]');
          all = all.concat(b);
        }catch(e){}
      });
      // dedupe by id
      const map = new Map();
      all.forEach(a=>{ if(a && a.id) map.set(a.id, a); });
      return Array.from(map.values());
    }catch(e){ return []; }
  }
  
  function saveAll(arts){
    try{
      localStorage.setItem(MAIN_KEY, JSON.stringify(arts));
      BACKUP_KEYS.forEach(k=> localStorage.setItem(k, JSON.stringify(arts)));
      console.log('💾 Saved', arts.length, 'artisans to all backups');
    }catch(e){}
  }
  
  // On load, restore immediately
  let existing = getAllLocal();
  console.log('📂 Found', existing.length, 'local artisans');
  
  // Intercept setItem to NEVER allow overwrite with smaller list
  const origSetItem = localStorage.setItem.bind(localStorage);
  localStorage.setItem = function(key, value){
    if(key === MAIN_KEY){
      try{
        let incoming = JSON.parse(value);
        let current = getAllLocal();
        if(Array.isArray(incoming) && current.length > incoming.length){
          console.log('🚫 BLOCKED overwrite attempt:', incoming.length, 'vs current', current.length, '- merging');
          // Merge: keep all current + any new from incoming
          const map = new Map();
          current.forEach(a=> map.set(a.id, a));
          incoming.forEach(a=>{ if(a && a.id && !map.has(a.id)) map.set(a.id, a); });
          let merged = Array.from(map.values());
          // If incoming has a new artisan not in current, include it
          if(merged.length >= current.length){
            value = JSON.stringify(merged);
            saveAll(merged);
            return origSetItem(key, value);
          } else {
            // Don't allow shrink
            return origSetItem(key, JSON.stringify(current));
          }
        } else {
          // Save to backups too
          saveAll(incoming);
        }
      }catch(e){}
    }
    return origSetItem(key, value);
  };
  
  // Every 1 second, force restore if React tries to delete
  setInterval(()=>{
    let locals = getAllLocal();
    try{
      let currentMain = JSON.parse(localStorage.getItem(MAIN_KEY)||'[]');
      if(locals.length > currentMain.length){
        console.log('🔄 Restoring from backup', locals.length);
        origSetItem(MAIN_KEY, JSON.stringify(locals));
      }
    }catch(e){}
  }, 1000);
  
  // Also hijack Firestore to inject local artisans into fetch results
  // Wait for Firebase to load
  setTimeout(()=>{
    try{
      // Try to find Firestore functions and patch getDocs
      console.log('🔍 Patching Firebase fetch to include local artisans');
    }catch(e){}
  }, 2000);
  
  // Save the Mr Abasiodiong if exists in memory
  window.ogaworkSaveTest = function(){
    let arts = getAllLocal();
    console.log('Current artisans:', arts);
    alert('You have '+arts.length+' artisans saved locally. These will NOT disappear now!');
  };
})();
</script>

// ULTRA PERSISTENCE - NOTHING DISAPPEARS AFTER REFRESH - FINAL
(function(){
  console.log('🔒 ULTRA PERSISTENCE - Fixing disappearing after refresh');
  
  // 1. Backup existing data BEFORE React app can delete it
  let backupArtisans = null;
  let backupUsers = null;
  let backupCurrent = null;
  try{
    backupArtisans = localStorage.getItem('ogawork_artisans');
    backupUsers = localStorage.getItem('ogawork_all_users');
    backupCurrent = localStorage.getItem('ogawork_current_user');
    if(backupArtisans) {
      // Save to 3 backup locations
      localStorage.setItem('ogawork_artisans_backup', backupArtisans);
      localStorage.setItem('ogawork_artisans_backup2', backupArtisans);
      sessionStorage.setItem('ogawork_artisans_backup', backupArtisans);
      console.log('💾 Backed up', JSON.parse(backupArtisans).length, 'artisans');
    }
  }catch(e){}

  // 2. Override localStorage to PREVENT deletion
  const realSet = localStorage.setItem.bind(localStorage);
  const realGet = localStorage.getItem.bind(localStorage);
  const realRemove = localStorage.removeItem.bind(localStorage);
  
  localStorage.setItem = function(k,v){
    // PREVENT overwriting artisans with empty array
    if(k==='ogawork_artisans'){
      try{
        let newVal = JSON.parse(v);
        let oldVal = JSON.parse(realGet('ogawork_artisans')||'[]');
        let backupVal = JSON.parse(realGet('ogawork_artisans_backup')||'[]');
        
        // If new value is empty but old has data, KEEP OLD
        if(Array.isArray(newVal) && newVal.length===0 && oldVal.length>0){
          console.log('🛑 BLOCKED attempt to delete artisans! Keeping', oldVal.length);
          return; // Don't save empty
        }
        if(Array.isArray(newVal) && newVal.length===0 && backupVal.length>0){
          console.log('🛑 BLOCKED empty, restoring backup', backupVal.length);
          realSet(k, JSON.stringify(backupVal));
          return;
        }
        // If new is smaller than old, merge
        if(newVal.length < oldVal.length && oldVal.length>0){
          console.log('🛑 New smaller than old, merging');
          let merged = [...oldVal];
          newVal.forEach(n=>{
            if(!merged.find(o=>o.email===n.email)) merged.push(n);
          });
          v = JSON.stringify(merged);
        }
      }catch(e){}
    }
    realSet(k,v);
    // Always backup
    if(k==='ogawork_artisans'){
      try{
        realSet('ogawork_artisans_backup', v);
        realSet('ogawork_artisans_backup2', v);
        sessionStorage.setItem('ogawork_artisans_backup', v);
      }catch(e){}
    }
  };
  
  localStorage.removeItem = function(k){
    if(k==='ogawork_artisans' || k==='ogawork_all_users' || k==='ogawork_current_user'){
      console.log('🛑 BLOCKED attempt to remove', k);
      return; // Block deletion
    }
    realRemove(k);
  };

  // 3. Restore on load
  function restoreAll(){
    try{
      let main = realGet('ogawork_artisans');
      let b1 = realGet('ogawork_artisans_backup');
      let b2 = realGet('ogawork_artisans_backup2');
      let b3 = sessionStorage.getItem('ogawork_artisans_backup');
      
      let best = null;
      let maxLen = 0;
      [main, b1, b2, b3].forEach(src=>{
        if(src){
          try{
            let arr = JSON.parse(src);
            if(Array.isArray(arr) && arr.length > maxLen){
              maxLen = arr.length;
              best = src;
            }
          }catch(e){}
        }
      });
      
      if(best && best !== main){
        console.log('🔄 Restoring best artisans:', maxLen);
        realSet('ogawork_artisans', best);
      }
      
      // Show debug
      let count = JSON.parse(realGet('ogawork_artisans')||'[]').length;
      console.log('📊 Artisans in storage:', count);
    }catch(e){}
  }
  
  restoreAll();
  setInterval(restoreAll, 2000);
  window.addEventListener('load', restoreAll);
  window.addEventListener('storage', restoreAll);
  
    window.addEventListener('load', addDebugPanel);
  
  console.log('✅ ULTRA PERSISTENCE ACTIVE - Refresh will NOT delete');
})();
</script>

<script>
// CLOUDINARY PERMANENT PICTURES - WORKING VERSION
(function(){
  try{
    const originalCreateObjectURL = URL.createObjectURL.bind(URL);
    
    URL.createObjectURL = function(blob){
      const localUrl = originalCreateObjectURL(blob);
      
      // Only for images
      if(blob && blob.type && blob.type.startsWith('image/')){
        // Save local version immediately
        try{
          const reader = new FileReader();
          reader.onload = function(e){
            try{
              const map = JSON.parse(localStorage.getItem('ogawork_url_map')||'{}');
              map[localUrl] = e.target.result;
              localStorage.setItem('ogawork_url_map', JSON.stringify(map));
              // Update all images using this url
              document.querySelectorAll('img').forEach(img=>{
                if(img.src === localUrl){
                  img.src = e.target.result;
                }
              });
            }catch(err){}
          };
          reader.readAsDataURL(blob);
        }catch(err){}
        
        // Upload to Cloudinary for permanent storage
        try{
          const cloudName = localStorage.getItem('cloudinary_cloud_name');
          const preset = localStorage.getItem('cloudinary_upload_preset');
          
          if(cloudName && preset){
            console.log('☁️ Uploading to Cloudinary...', cloudName, preset);
            const formData = new FormData();
            formData.append('file', blob);
            formData.append('upload_preset', preset);
            formData.append('folder', 'ogaworkman');
            
            fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
              method: 'POST',
              body: formData
            })
            .then(r=>r.json())
            .then(data=>{
              if(data.secure_url){
                console.log('✅ Cloudinary permanent URL:', data.secure_url);
                try{
                  const map = JSON.parse(localStorage.getItem('ogawork_url_map')||'{}');
                  map[localUrl] = data.secure_url;
                  localStorage.setItem('ogawork_url_map', JSON.stringify(map));
                  
                  // Update images to permanent URL
                  document.querySelectorAll('img').forEach(img=>{
                    if(img.src === localUrl || img.src === map[localUrl]){
                      img.src = data.secure_url;
                    }
                  });
                  
                  // Show success
                  const toast = document.createElement('div');
                  toast.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#00aa00;color:white;padding:12px 20px;border-radius:20px;font-size:12px;z-index:99999;';
                  toast.textContent = '✅ Picture saved permanent to Cloudinary!';
                  document.body.appendChild(toast);
                  setTimeout(()=>toast.remove(), 3000);
                }catch(err){}
              } else {
                console.log('Cloudinary error:', data);
              }
            })
            .catch(err=>{
              console.log('Cloudinary upload failed:', err);
            });
          } else {
            console.log('Cloudinary not set - using local only');
          }
        }catch(err){
          console.log('Cloudinary setup error:', err);
        }
      }
      
      return localUrl;
    };
    
    // Restore images from url_map on load
    function restoreCloudinaryImages(){
      try{
        const map = JSON.parse(localStorage.getItem('ogawork_url_map')||'{}');
        const urls = Object.values(map);
        if(urls.length>0){
          console.log('Restoring', urls.length, 'images from Cloudinary map');
          document.querySelectorAll('img').forEach(img=>{
            const src = img.getAttribute('src') || img.src;
            if(map[src]){
              img.src = map[src];
            }
          });
        }
      }catch(err){}
    }
    
    setInterval(restoreCloudinaryImages, 2000);
    window.addEventListener('load', restoreCloudinaryImages);
    
  }catch(err){
    console.log('Cloudinary init error:', err);
  }
})();
</script>

<script>
// LOGOUT FIX: Show logout for artisans/clients and hide admin on logout
(function(){
  function initLogoutFix(){
    // Create global logout button for artisans/clients
    function createLogoutButton(){
      if(document.getElementById('global-logout-btn')) return;
      
      const logoutBtn = document.createElement('button');
      logoutBtn.id = 'global-logout-btn';
      logoutBtn.style.cssText = 'position:fixed;top:10px;right:10px;z-index:9997;background:#ff4444;color:white;border:none;padding:8px 14px;border-radius:20px;font-size:11px;font-weight:bold;display:none;box-shadow:0 2px 8px rgba(0,0,0,0.3);';
      logoutBtn.textContent = '🚪 Logout';
      logoutBtn.onclick = function(){
        if(confirm('Logout?')){
          // Clear admin flags
          localStorage.removeItem('ogawork_show_admin_tab');
          localStorage.removeItem('ogawork_admin_unlocked');
          localStorage.removeItem('ogawork_hidden_admin_unlocked');
          
          // Try to find and click existing logout button in app
          const existingLogout = Array.from(document.querySelectorAll('button')).find(b=> b.textContent.toLowerCase().includes('logout') && !b.closest('#hidden-admin-modal') && b.id !== 'global-logout-btn');
          if(existingLogout){
            existingLogout.click();
          } else {
            // Fallback: clear user and reload
            try{
              localStorage.removeItem('ogawork_current_user');
              localStorage.removeItem('currentUser');
              localStorage.removeItem('user');
            }catch(e){}
            location.reload();
          }
        }
      };
      document.body.appendChild(logoutBtn);
    }
    
    createLogoutButton();
    
    // Show/hide logout button based on login state
    // Hide admin tab on logout
    function checkLoginState(){
      try{
        // Check if user is logged in (look for user name, profile, etc)
        const isLoggedIn = document.body.textContent.includes('Welcome') || 
                          document.querySelector('[class*="profile"]') !== null ||
                          localStorage.getItem('ogawork_current_user') !== null ||
                          document.querySelectorAll('button').length > 5;
        
        // Check if current user is admin by looking for admin-specific text or admin tab visible
        const isAdmin = localStorage.getItem('ogawork_show_admin_tab') === 'true' || 
                       document.body.textContent.includes('Welcome Admin') ||
                       Array.from(document.querySelectorAll('button')).some(b=>b.textContent.trim()==='Admin' && b.offsetParent !== null);
        
        const logoutBtn = document.getElementById('global-logout-btn');
        if(logoutBtn){
          // Show logout if logged in (not on login page)
          const onLoginPage = window.location.href.includes('login') || 
                             document.body.textContent.includes('Login') && document.body.textContent.includes('Sign Up') && document.querySelectorAll('input[type="email"]').length>0;
          
          // More accurate: check if we are NOT on login screen
          const hasLoginForm = document.querySelectorAll('input[type="email"]').length > 0 && document.querySelectorAll('button').length < 10;
          const hasUserContent = document.body.textContent.includes('Featured') || document.body.textContent.includes('Advertise') || document.body.textContent.includes('Jobs');
          
          if(hasUserContent && !hasLoginForm){
            logoutBtn.style.display = 'block';
          } else {
            // Check if logged in via other means
            if(localStorage.getItem('ogawork_show_admin_tab') || document.body.textContent.length > 500){
              logoutBtn.style.display = 'block';
            }
          }
        }
        
        // Hide admin tab if not admin
        if(!isAdmin){
          const adminTabUnlocked = localStorage.getItem('ogawork_show_admin_tab') === 'true';
          if(!adminTabUnlocked){
            document.querySelectorAll('button').forEach(btn=>{
              if(btn.textContent.trim() === 'Admin'){
                btn.style.display = 'none';
              }
            });
          }
        }
        
        // If logout detected (admin flags cleared and on home), hide admin
        if(!localStorage.getItem('ogawork_show_admin_tab')){
          document.querySelectorAll('button').forEach(btn=>{
            if(btn.textContent.trim() === 'Admin'){
              // Only hide if not explicitly unlocked
              if(!localStorage.getItem('ogawork_admin_unlocked')){
                // Keep hidden logic but allow show if admin
              }
            }
          });
        }
      }catch(err){}
    }
    
    // Check login state every second
    setInterval(checkLoginState, 1000);
    checkLoginState();
    
    // Also watch for logout - when logout happens, clear admin
    const originalClear = localStorage.clear;
    // We don't override, just watch
    
    // Listen for clicks on logout buttons to clear admin flags
    document.addEventListener('click', (e)=>{
      const target = e.target;
      if(target && target.textContent && target.textContent.toLowerCase().includes('logout')){
        setTimeout(()=>{
          localStorage.removeItem('ogawork_show_admin_tab');
          localStorage.removeItem('ogawork_admin_unlocked');
          console.log('Logout detected - admin hidden');
        }, 500);
      }
    }, true);
  }
  
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initLogoutFix);
  } else {
    initLogoutFix();
  }
  window.addEventListener('load', initLogoutFix);
})();
</script>

          // Chat room logout will be in same wrapper, already handled
        }
      }catch(err){ console.log('Logout inject error', err); }
    }
    
    // Run injection every 1.5 seconds and on navigation
    setInterval(injectLogoutInPage, 1500);
    injectLogoutInPage();
    
    // Also run after page changes
    let lastUrl = location.href;
    setInterval(()=>{
      if(location.href !== lastUrl){
        lastUrl = location.href;
        setTimeout(injectLogoutInPage, 500);
      }
    }, 500);
  }
  
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initLogoutPositionFix);
  } else {
    initLogoutPositionFix();
  }
  window.addEventListener('load', initLogoutPositionFix);
})();
</script>
